<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2&display=swap" rel="stylesheet">
  <title>Your Cart</title>
  <link rel="stylesheet" href="asmaconvenience.css">
</head>
<body>
  <header>
    <h1>🛒 Your Cart</h1>
    <a href="products.html" class="cart-link">← Continue Shopping</a>
  </header>

  <main>
    <div class="cart-wrapper">
      <section class="cart-table">
        <table>
          <thead>
            <tr>
              <th>Products Ordered</th>
              <th>Unit Price</th>
              <th>Amount</th>
              <th>Item Subtotal</th>
            </tr>
          </thead>
          <tbody id="cart-list">
            <!-- Rows added via JS -->
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td colspan="3">Total</td>
              <td id="cart-total">RM0.00</td>
            </tr>
          </tfoot>
        </table>
      </section>
  
      <!-- Button placed AFTER the table -->
      <div class="cart-footer">
        <button id="clear-cart" class="clear-btn">Clear Cart</button>
      </div>
    </div>
  </main>

<script src="addcart.js"></script>

</body>
</html>
